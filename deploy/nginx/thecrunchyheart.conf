# ==============================================================================
# The Crunchy Heart — Nginx Production Reverse Proxy & Static Host Configuration
# Domain: thecrunchyheart.com (and www.thecrunchyheart.com)
# Unified Origin Architecture:
#   - Serves Angular 20 Static Single Page Application from /var/www/thecrunchyheart/browser
#   - Reverse proxies /api/ requests to Node.js / Express listening on 127.0.0.1:5000
# ==============================================================================

# HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name thecrunchyheart.com www.thecrunchyheart.com api.thecrunchyheart.com;

    # Certbot challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Primary HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name thecrunchyheart.com www.thecrunchyheart.com;

    # SSL Configuration (Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/thecrunchyheart.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thecrunchyheart.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Root directory for compiled Angular storefront
    root /var/www/thecrunchyheart/browser;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;

    # Static Assets Caching (hashing is handled by Angular build)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # API Proxy -> Node.js Express server on port 5000
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;

        # WebSockets & Keep-Alive support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Real Client IP Headers (Single Hop: TRUST_PROXY=1 in backend env)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 15s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Disable buffering for streaming / webhook responsiveness
        proxy_buffering off;
        client_max_body_size 2m;
    }

    # Cashfree Webhooks (preserving raw headers)
    location /api/payments/cashfree/webhook {
        proxy_pass http://127.0.0.1:5000/api/payments/cashfree/webhook;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 2m;
    }

    # Angular SPA Route Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}

