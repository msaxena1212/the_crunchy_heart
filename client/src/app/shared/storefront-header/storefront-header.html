<div class="announcement-bar">
  <span>Free shipping on orders above ₹499</span>
  <span class="announcement-separator">•</span>
  <span>Pure &amp; premium pantry staples</span>
  <span class="announcement-separator">•</span>
  <span>Heartfully crunched</span>
</div>

<header class="site-header">
  <div class="nav-shell">
    <button class="brand" type="button" aria-label="The Crunchy Heart home" (click)="goHome()">
      <span class="brand-heart" aria-hidden="true">♡</span>
      <span class="brand-copy">
        <strong>The Crunchy Heart</strong>
        <small>PREMIUM PANTRY</small>
      </span>
    </button>

    <nav class="main-nav" aria-label="Main navigation">
      <button type="button" (click)="goHome()">Home</button>

      <div class="nav-dropdown" [class.is-open]="shopMenuOpen" (mouseleave)="closeShopMenu()">
        <button
          type="button"
          class="nav-dropdown-trigger"
          aria-haspopup="true"
          [attr.aria-expanded]="shopMenuOpen"
          (click)="toggleShopMenu($event)"
          (mouseenter)="openShopMenu()">
          Shop
          <svg viewBox="0 0 12 12" width="10" height="10" aria-hidden="true">
            <path d="M2 4.2 6 8l4-3.8" fill="none" stroke="currentColor" stroke-width="1.7"
                  stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>

        <div class="nav-dropdown-panel" role="menu">
          <p class="nav-dropdown-label">Makhana</p>
          <button type="button" role="menuitem" (click)="navigateToSection('raw-makhana')">
            <span>Raw Makhana</span><small>100g – 1kg packs</small>
          </button>
          <button type="button" role="menuitem" (click)="navigateToSection('flavoured-makhana')">
            <span>Flavoured Makhana</span><small>8 slow-roasted flavours</small>
          </button>

          <p class="nav-dropdown-label">More categories</p>
          <button type="button" role="menuitem" (click)="goToCategory('dry-fruits')">
            <span>Dry Fruits</span><small>Almonds, cashews, walnuts &amp; more</small>
          </button>
          <button type="button" role="menuitem" (click)="goToCategory('spices')">
            <span>Spices</span><small>Whole, ground &amp; blends</small>
          </button>
        </div>
      </div>

      <button type="button" (click)="navigateToSection('festive-gifting')">Gifting</button>
      <button type="button" (click)="goToBulk()">Bulk &amp; Wholesale</button>
      <button type="button" (click)="navigateToSection('our-story')">Our Story</button>
      <button type="button" (click)="navigateToSection('faqs')">FAQs</button>
    </nav>

    <div class="nav-actions">
      <a routerLink="/cart" class="nav-cart" aria-label="Shopping cart">
        <svg viewBox="0 0 24 24" width="23" height="23" fill="none"
             stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true">
          <circle cx="9" cy="21" r="1"></circle>
          <circle cx="19" cy="21" r="1"></circle>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
        </svg>
        <span class="cart-count" *ngIf="cartCount > 0">{{ cartCount }}</span>
      </a>

      <button
        class="mobile-menu-toggle"
        type="button"
        [attr.aria-expanded]="mobileMenuOpen"
        aria-controls="storefront-mobile-navigation"
        [attr.aria-label]="mobileMenuOpen ? 'Close menu' : 'Open menu'"
        (click)="toggleMobileMenu()">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>

  <nav
    id="storefront-mobile-navigation"
    class="mobile-navigation"
    aria-label="Mobile navigation"
    [class.is-open]="mobileMenuOpen"
    [attr.aria-hidden]="!mobileMenuOpen"
    [attr.inert]="mobileMenuOpen ? null : ''">
    <button type="button" (click)="goHome()">Home <span>→</span></button>

    <p class="mobile-nav-label">Shop by category</p>
    <button type="button" (click)="navigateToSection('raw-makhana')">Raw Makhana <span>→</span></button>
    <button type="button" (click)="navigateToSection('flavoured-makhana')">Flavoured Makhana <span>→</span></button>
    <button type="button" (click)="goToCategory('dry-fruits')">Dry Fruits <span>→</span></button>
    <button type="button" (click)="goToCategory('spices')">Spices <span>→</span></button>

    <p class="mobile-nav-label">Explore</p>
    <button type="button" (click)="navigateToSection('festive-gifting')">Gifting &amp; Hampers <span>→</span></button>
    <button type="button" (click)="goToBulk()">Bulk &amp; Wholesale <span>→</span></button>
    <button type="button" (click)="navigateToSection('our-story')">Our Story <span>→</span></button>
    <button type="button" (click)="navigateToSection('why-us')">Why Us <span>→</span></button>
    <button type="button" (click)="navigateToSection('faqs')">FAQs <span>→</span></button>
  </nav>
</header>
