<div class="announcement-bar">
  <span>Free shipping on orders above ₹499</span>
  <span class="announcement-separator">•</span>
  <span>Pure &amp; premium pantry staples</span>
  <span class="announcement-separator">•</span>
  <span>Heartfully crunched</span>
</div>

<header class="site-header">
  <div class="nav-shell">
    <button class="brand" type="button" aria-label="The Crunchy Heart home" (click)="goHome()">
      <span class="brand-heart" aria-hidden="true">♡</span>
      <span class="brand-copy">
        <strong>The Crunchy Heart</strong>
        <small>PREMIUM PANTRY</small>
      </span>
    </button>

    <nav class="main-nav" aria-label="Main navigation">
      <button type="button" (click)="goHome()">Home</button>

      <div class="nav-dropdown" [class.is-open]="shopMenuOpen" (mouseleave)="closeShopMenu()">
        <button
          type="button"
          class="nav-dropdown-trigger"
          aria-haspopup="true"
          [attr.aria-expanded]="shopMenuOpen"
          (click)="toggleShopMenu($event)"
          (mouseenter)="openShopMenu()">
          Shop
          <svg viewBox="0 0 12 12" width="10" height="10" aria-hidden="true">
            <path d="M2 4.2 6 8l4-3.8" fill="none" stroke="currentColor" stroke-width="1.7"
                  stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>

        <div class="nav-dropdown-panel" role="menu">
          <div class="nav-dropdown-col">
            <p class="nav-dropdown-label">Makhana (Flagship)</p>
            <button type="button" role="menuitem" (click)="goToCategory('raw-makhana')">
              <span>Raw Mithila Makhana</span><small>100g – 1kg jumbo grades</small>
            </button>
            <button type="button" role="menuitem" (click)="goToCategory('flavoured-makhana')">
              <span>Flavoured Makhana</span><small>8 slow-roasted flavours</small>
            </button>

            <p class="nav-dropdown-label">Nuts, Seeds &amp; Superfoods</p>
            <button type="button" role="menuitem" (click)="goToCategory('dry-fruits')">
              <span>Dry Fruits &amp; Nuts</span><small>Almonds, cashews, walnuts, raisins &amp; figs</small>
            </button>
            <button type="button" role="menuitem" (click)="goToCategory('seeds-superfoods')">
              <span>Seeds &amp; Superfoods</span><small>Chia, pumpkin, sunflower, flax &amp; sabja</small>
            </button>
          </div>

          <div class="nav-dropdown-col">
            <p class="nav-dropdown-label">Spices &amp; Seasonings</p>
            <button type="button" role="menuitem" (click)="goToCategory('whole-spices')">
              <span>Whole Spices</span><small>Sun-dried single-origin aromatics</small>
            </button>
            <button type="button" role="menuitem" (click)="goToCategory('ground-spices')">
              <span>Ground Spices</span><small>Pure stone-ground haldi, mirch &amp; dhania</small>
            </button>
            <button type="button" role="menuitem" (click)="goToCategory('blended-masalas')">
              <span>Blended Masalas</span><small>Artisanal culinary spice blends</small>
            </button>

            <p class="nav-dropdown-label">Heritage Pantry &amp; Gifting</p>
            <button type="button" role="menuitem" (click)="goToCategory('grains-millets')">
              <span>Grains &amp; Millets</span><small>Unpolished traditional Indian millets</small>
            </button>
            <button type="button" role="menuitem" (click)="goToCategory('festive-gifting')">
              <span>Gifting &amp; Hampers</span><small>Curated celebration gift hampers</small>
            </button>
          </div>

          <div class="nav-dropdown-footer">
            <button type="button" role="menuitem" class="nav-dropdown-all-btn" (click)="goToCategory('all')">
              <span>Shop All Products</span>
              <small>Explore the complete 10-category pantry catalogue →</small>
            </button>
          </div>
        </div>
      </div>

      <button type="button" (click)="navigateToSection('festive-gifting')">Gifting</button>
      <button type="button" (click)="goToBulk()">Bulk &amp; Wholesale</button>
      <button type="button" (click)="navigateToSection('our-story')">Our Story</button>
      <button type="button" (click)="navigateToSection('faqs')">FAQs</button>
    </nav>

    <div class="nav-actions">
      <!-- ACCOUNT / SIGN IN BUTTON -->
      <button
        type="button"
        class="nav-account"
        (click)="openAccountOrLogin()"
        [attr.aria-label]="isLoggedIn ? 'My Account' : 'Sign In'">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none"
             stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
        <span class="account-label">{{ isLoggedIn ? (customer?.name ? customer!.name.split(' ')[0] : 'Account') : 'Sign In' }}</span>
      </button>

      <button type="button" class="nav-cart" (click)="openCartDrawer($event)" aria-label="Shopping cart">
        <svg viewBox="0 0 24 24" width="23" height="23" fill="none"
             stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true">
          <circle cx="9" cy="21" r="1"></circle>
          <circle cx="19" cy="21" r="1"></circle>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
        </svg>
        <span class="cart-count" *ngIf="cartCount > 0">{{ cartCount }}</span>
      </button>

      <button
        class="mobile-menu-toggle"
        type="button"
        [attr.aria-expanded]="mobileMenuOpen"
        aria-controls="storefront-mobile-navigation"
        [attr.aria-label]="mobileMenuOpen ? 'Close menu' : 'Open menu'"
        (click)="toggleMobileMenu()">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>

  <nav
    id="storefront-mobile-navigation"
    class="mobile-navigation"
    aria-label="Mobile navigation"
    [class.is-open]="mobileMenuOpen"
    [attr.aria-hidden]="!mobileMenuOpen"
    [attr.inert]="mobileMenuOpen ? null : ''">
    <!-- ACCOUNT BUTTON IN MOBILE MENU -->
    <button type="button" class="mobile-account-btn" (click)="openAccountOrLogin()">
      <span>👤 {{ isLoggedIn ? 'My Account (' + (customer?.name || 'User') + ')' : 'Sign In / Register' }}</span>
      <span>→</span>
    </button>

    <button type="button" (click)="goHome()">Home <span>→</span></button>

    <p class="mobile-nav-label">Shop by category</p>
    <button type="button" (click)="goToCategory('all')">All Products <span>→</span></button>
    <button type="button" (click)="goToCategory('raw-makhana')">Raw Mithila Makhana <span>→</span></button>
    <button type="button" (click)="goToCategory('flavoured-makhana')">Flavoured Makhana <span>→</span></button>
    <button type="button" (click)="goToCategory('dry-fruits')">Dry Fruits &amp; Nuts <span>→</span></button>
    <button type="button" (click)="goToCategory('seeds-superfoods')">Seeds &amp; Superfoods <span>→</span></button>
    <button type="button" (click)="goToCategory('whole-spices')">Whole Spices <span>→</span></button>
    <button type="button" (click)="goToCategory('ground-spices')">Ground Spices <span>→</span></button>
    <button type="button" (click)="goToCategory('blended-masalas')">Blended Masalas <span>→</span></button>
    <button type="button" (click)="goToCategory('grains-millets')">Grains &amp; Millets <span>→</span></button>
    <button type="button" (click)="goToCategory('festive-gifting')">Gifting &amp; Hampers <span>→</span></button>

    <p class="mobile-nav-label">Explore</p>
    <button type="button" (click)="navigateToSection('festive-gifting')">Gifting &amp; Hampers <span>→</span></button>
    <button type="button" (click)="goToBulk()">Bulk &amp; Wholesale <span>→</span></button>
    <button type="button" (click)="navigateToSection('our-story')">Our Story <span>→</span></button>
    <button type="button" (click)="navigateToSection('why-us')">Why Us <span>→</span></button>
    <button type="button" (click)="navigateToSection('faqs')">FAQs <span>→</span></button>
  </nav>
</header>
