<div class="console">
  <aside class="sidebar" aria-label="Owner console navigation">
    <a class="console-brand" routerLink="/admin/dashboard" aria-label="The Crunchy Heart owner console home">
      <span class="console-brand-mark" aria-hidden="true">♡</span>
      <span class="console-brand-copy">
        <span class="console-brand-title">The Crunchy Heart</span>
        <span class="console-brand-tag">Owner console</span>
      </span>
    </a>

    <nav class="console-nav">
      <div class="nav-group" *ngFor="let group of navGroups">
        <div class="group-title">{{ group.title }}</div>
        <a *ngFor="let item of group.items"
           [routerLink]="item.path"
           routerLinkActive="active"
           class="nav-link">
          {{ item.label }}
        </a>
      </div>
    </nav>

    <div class="sidebar-foot">
      <a routerLink="/" target="_blank" class="nav-link">View storefront ↗</a>
    </div>
  </aside>

  <div class="console-main">
    <header class="topbar">
      <div class="topbar-user" *ngIf="adminService.currentAdmin() as admin">
        <span class="user-avatar" aria-hidden="true">{{ (admin.fullName || admin.email || '?').charAt(0).toUpperCase() }}</span>
        <span class="user-email">{{ admin.email }}</span>
      </div>
      <button class="logout-button" (click)="onLogout()" title="Sign out">Sign out</button>
    </header>

    <main class="console-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
